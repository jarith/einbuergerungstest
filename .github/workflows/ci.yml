name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/run-check.yml
    with:
      script: build

  lint:
    name: Lint
    uses: ./.github/workflows/run-check.yml
    with:
      script: lint

  typecheck:
    name: ts:compile
    uses: ./.github/workflows/run-check.yml
    with:
      script: ts:compile

  format-check:
    name: Format check
    uses: ./.github/workflows/run-check.yml
    with:
      script: format:check

  tooling-tests:
    name: Tooling regression tests
    uses: ./.github/workflows/run-check.yml
    with:
      script: test:tooling

  behavior-tests:
    name: Business integration specifications
    uses: ./.github/workflows/run-check.yml
    with:
      script: test:behavior
      install-browsers: true

  ui-tests:
    name: Browser UI tests
    uses: ./.github/workflows/run-check.yml
    with:
      script: test:ui
      install-browsers: true

  e2e-scope:
    name: Select E2E scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check application and test boundaries
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" HEAD -- web e2e packages/design-system package.json yarn.lock mise.toml mise.lock .github; then
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  e2e-tests:
    name: Selected E2E journeys
    needs: [behavior-tests, browser-tests, e2e-scope]
    if: needs.e2e-scope.outputs.run == 'true'
    uses: ./.github/workflows/run-check.yml
    with:
      script: test:e2e
      install-browsers: true

  browser-tests:
    name: Browser tests
    uses: ./.github/workflows/run-check.yml
    with:
      script: test:browser
      install-browsers: true

  storybook-tests:
    name: Storybook tests
    uses: ./.github/workflows/run-check.yml
    with:
      script: test:storybook
      install-browsers: true
