name: Run check

on:
  workflow_call:
    inputs:
      script:
        description: Root package script to run
        required: true
        type: string
      browsers:
        description: Space-separated preinstalled browsers to use (chromium and/or webkit); empty runs on the host
        required: false
        default: ''
        type: string
      production-build:
        description: Build indexable public pages and upload the production artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-check:
    name: Run ${{ inputs.script }}
    runs-on: ubuntu-26.04
    container:
      # Keep this version aligned with the Playwright packages in package.json.
      image: ${{ inputs.browsers != '' && 'mcr.microsoft.com/playwright:v1.63.0-resolute' || '' }}
      options: --init --ipc=host
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read mise version
        id: mise-version
        run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"

      - name: Set up locked tools
        uses: jdx/mise-action@v4
        with:
          version: ${{ steps.mise-version.outputs.version }}
          install_args: --locked

      - name: Resolve Yarn cache directory
        id: yarn-cache
        run: echo "cache-directory=$(mise exec -- yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.cache-directory }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'yarn.lock', '.yarnrc.yml', 'package.json') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: mise exec -- yarn install --immutable

      - name: Verify preinstalled Playwright browsers
        if: inputs.browsers != ''
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          mise exec -- node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright'

          const browserTypes = new Map([['chromium', chromium], ['webkit', webkit]])

          for (const name of process.env.BROWSERS.split(' ')) {
            const browserType = browserTypes.get(name)
            if (!browserType) throw new Error(`Unsupported CI browser: ${name}`)

            // Default headless Chromium uses the preinstalled headless shell.
            const browser = await browserType.launch({ headless: true })
            console.log(`${name}: ${browser.version()}`)
            await browser.close()
          }
          NODE

      - name: Run check
        id: check
        env:
          SCRIPT: ${{ inputs.script }}
          SITE_INDEXABLE: ${{ inputs.production-build && inputs.script == 'build' && 'true' || 'false' }}
        run: mise exec -- yarn "$SCRIPT"

      - name: Save UI test failure artifacts
        if: failure() && inputs.script == 'test:ui' && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-test-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Save production build
        if: inputs.production-build && inputs.script == 'build'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pages-${{ github.sha }}-${{ github.run_id }}
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
