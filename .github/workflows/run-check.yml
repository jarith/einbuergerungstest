name: Run check

on:
  workflow_call:
    inputs:
      script:
        description: Root package script to run
        required: true
        type: string
      install-browsers:
        description: Whether to install Chromium, WebKit, and their system dependencies
        required: false
        default: false
        type: boolean
      production-build:
        description: Build indexable public pages and upload the production artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-check:
    name: Run ${{ inputs.script }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read mise version
        id: mise-version
        run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"

      - name: Set up locked tools
        uses: jdx/mise-action@v4
        with:
          version: ${{ steps.mise-version.outputs.version }}
          install_args: --locked

      - name: Resolve Yarn cache directory
        id: yarn-cache
        run: echo "cache-directory=$(mise exec -- yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.cache-directory }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'yarn.lock', '.yarnrc.yml', 'package.json') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: mise exec -- yarn install --immutable

      - name: Install Playwright browser
        if: ${{ inputs.install-browsers }}
        run: mise exec -- yarn browser:install --with-deps

      - name: Run check
        env:
          SCRIPT: ${{ inputs.script }}
          SITE_INDEXABLE: ${{ inputs.production-build && inputs.script == 'build' && 'true' || 'false' }}
        run: mise exec -- yarn "$SCRIPT"

      - name: Save production build
        if: inputs.production-build && inputs.script == 'build'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pages-${{ github.sha }}-${{ github.run_id }}
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
