checksumBehavior: throw
compressionLevel: mixed
defaultSemverRangePrefix: ''
enableGlobalCache: false
enableScripts: false
enableTelemetry: false
nodeLinker: node-modules
npmMinimalAgeGate: 1440

# Panda's evaluator consumes the classic compiler API, independently of tsc 7.
packageExtensions:
  'eslint-plugin-storybook@10.6.0':
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  '@pandacss/eslint-plugin@0.3.2':
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  '@pandacss/extractor@1.12.1':
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  'storybook@10.6.0':
    peerDependencies:
      react: '^19.3.0'
